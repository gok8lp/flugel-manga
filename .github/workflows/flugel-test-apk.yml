name: Flugel test APK

on:
  workflow_dispatch:
    inputs:
      surum:
        description: 'Yayin etiketi (or. v0.1.1-test)'
        required: true
        default: v0.1.1-test

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build installable debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Select and verify universal APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*-debug.apk' \
            ! -name '*arm64-v8a*' ! -name '*armeabi-v7a*' ! -name '*x86*' | sort)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one universal debug APK, found ${#apks[@]}" >&2
            find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -printf '%f\n'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "${apks[0]}"
          cp -- "${apks[0]}" Flugel-Manga-test.apk
          sha256sum Flugel-Manga-test.apk > Flugel-Manga-test.apk.sha256
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.surum }}" Flugel-Manga-test.apk Flugel-Manga-test.apk.sha256 \
            --target "$GITHUB_SHA" --title "Flugel Manga ${{ inputs.surum }}" --prerelease \
            --notes 'Koharia tabanlı Android test APK. Komga/Kavita bağlantısını uygulamada kurun; kimlik bilgileri APK içine gömülü değildir. Fiziksel cihaz testi bekleniyor.'
